# Tool configuration only — this repo is not an installable package.

[project]
name = "utils-bash"
version = "0.0.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
search-path = [
    "src",
    "scripts",
    ".",
]
