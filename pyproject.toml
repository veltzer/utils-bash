# Tool configuration only — this repo is not an installable package.

[project]
name = "utils-bash"
version = "0.0.0"
requires-python = ">=3.14"

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true
